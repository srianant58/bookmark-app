<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmark Dashboard</title>
<style>
  :root {
    --color-primary: #2563eb;
    --color-primary-dark: #1d4ed8;
    --color-primary-light: #dbeafe;
    --color-accent: #3b82f6;
    --color-bg: #f0f5fc;
    --color-surface: #ffffff;
    --color-border: #dbe4f3;
    --color-text: #1e293b;
    --color-text-muted: #64748b;
    --color-danger: #dc2626;
    --color-danger-hover: #b91c1c;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-card: 0 1px 3px rgba(30, 64, 175, 0.08), 0 1px 2px rgba(30, 64, 175, 0.06);
    --shadow-card-hover: 0 4px 12px rgba(30, 64, 175, 0.12);
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
  }

  .app-header {
    background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
    color: #ffffff;
    padding: var(--space-6) var(--space-4);
    text-align: center;
  }
  .app-header h1 { margin: 0 0 var(--space-1); font-size: 1.75rem; font-weight: 700; }
  .app-header p { margin: 0; font-size: 0.95rem; opacity: 0.9; }

  .container { max-width: 1100px; margin: 0 auto; padding: var(--space-6) var(--space-4); }

  .panel {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    box-shadow: var(--shadow-card);
    margin-bottom: var(--space-6);
  }
  .panel h2 { margin: 0 0 var(--space-3); font-size: 1.1rem; }

  .panel-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 600;
    list-style: none;
  }
  .panel-summary::-webkit-details-marker { display: none; }
  .panel-summary:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--color-primary-light);
    border-radius: var(--radius-sm);
  }
  .panel-summary .chevron {
    color: var(--color-primary);
    transition: transform .15s ease;
  }
  #add-panel[open] .panel-summary .chevron { transform: rotate(90deg); }
  #add-panel[open] .panel-summary { margin-bottom: var(--space-3); }
  #add-panel #bookmark-form { margin-top: var(--space-1); }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: var(--space-3);
  }
  .form-field { display: flex; flex-direction: column; gap: var(--space-1); }
  .form-field.full { grid-column: 1 / -1; }
  .form-field label { font-size: 0.8rem; font-weight: 600; color: var(--color-text-muted); }
  .form-field input,
  .form-field textarea {
    font: inherit;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-bg);
    color: var(--color-text);
  }
  .form-field input:focus,
  .form-field textarea:focus,
  #search-input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-light);
  }
  .form-field textarea { resize: vertical; min-height: 44px; }

  .btn {
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-4);
  }
  .btn-primary { background: var(--color-primary); color: #fff; }
  .btn-primary:hover { background: var(--color-primary-dark); }

  .toolbar {
    display: flex;
    gap: var(--space-4);
    align-items: center;
    margin-bottom: var(--space-4);
    flex-wrap: wrap;
  }
  #search-input {
    font: inherit;
    flex: 1;
    min-width: 200px;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    color: var(--color-text);
  }

  .chip-row {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
  }
  .chip {
    font: inherit;
    font-size: 0.875rem;
    cursor: pointer;
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
    border-radius: 999px;
    padding: 6px 14px;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--color-primary); }
  .chip--active {
    background: var(--color-primary);
    color: #fff;
    border-color: var(--color-primary);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: var(--space-4);
  }

  .card {
    position: relative;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    box-shadow: var(--shadow-card);
    transition: box-shadow .15s ease, transform .15s ease;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }
  .card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-2px); }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-2); }
  .card-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--color-primary-dark);
    text-decoration: none;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .card-title:hover { text-decoration: underline; }

  .card-actions { display: flex; gap: var(--space-1); flex-shrink: 0; }

  .edit-btn,
  .delete-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--color-text-muted);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: var(--space-1) var(--space-2);
    border-radius: var(--radius-sm);
  }
  .edit-btn:hover { color: var(--color-primary-dark); background: var(--color-primary-light); }
  .delete-btn:hover { color: var(--color-danger-hover); background: #fee2e2; }

  .card-edit-actions {
    display: flex;
    gap: var(--space-2);
    justify-content: flex-end;
    margin-top: var(--space-1);
  }
  .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
  .btn-secondary { background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-border); }
  .btn-secondary:hover { background: var(--color-border); }

  .card-url {
    display: block;
    font-size: 0.85rem;
    color: var(--color-text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-badge {
    align-self: flex-start;
    background: var(--color-primary-light);
    color: var(--color-primary-dark);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .card-notes {
    font-size: 0.875rem;
    color: var(--color-text-muted);
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 0;
  }

  .empty-state {
    text-align: center;
    color: var(--color-text-muted);
    padding: var(--space-8) var(--space-4);
    font-size: 1rem;
  }

  .save-warning {
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fde68a;
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
    font-size: 0.85rem;
    margin-bottom: var(--space-4);
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .toolbar { flex-direction: column; align-items: stretch; }
  }

  @media (max-width: 420px) {
    .app-header h1 { font-size: 1.25rem; }
    .container { padding: var(--space-4) var(--space-3); }
    .card { padding: var(--space-3); }
    .chip-row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: var(--space-1); }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>🔖 Bookmark Dashboard</h1>
  <p>Your personal bookmarks, saved right in this browser.</p>
</header>

<main class="container">

  <details class="panel" id="add-panel">
    <summary class="panel-summary">
      <span>Add a Bookmark</span>
      <span class="chevron" aria-hidden="true">▸</span>
    </summary>
    <form id="bookmark-form" novalidate>
      <div class="form-grid">
        <div class="form-field">
          <label for="input-title">Title</label>
          <input id="input-title" name="title" type="text" required>
        </div>
        <div class="form-field">
          <label for="input-url">URL</label>
          <input id="input-url" name="url" type="url" placeholder="example.com" required>
        </div>
        <div class="form-field">
          <label for="input-category">Category</label>
          <input id="input-category" name="category" type="text" list="category-options" required>
          <datalist id="category-options"></datalist>
        </div>
        <div class="form-field full">
          <label for="input-notes">Notes (optional)</label>
          <textarea id="input-notes" name="notes" rows="2"></textarea>
        </div>
        <div class="form-field full">
          <button type="submit" class="btn btn-primary">Add Bookmark</button>
        </div>
      </div>
    </form>
  </details>

  <div id="save-warning" class="save-warning" hidden></div>

  <section class="toolbar">
    <input id="search-input" type="search" placeholder="Search by title or category…">
    <div id="category-chips" class="chip-row"></div>
  </section>

  <section id="bookmark-grid" class="grid" aria-live="polite"></section>
  <p id="empty-state" class="empty-state" hidden></p>

</main>

<script>
  const STORAGE_KEY = 'bookmark-dashboard.bookmarks.v1';

  const SAMPLE_BOOKMARKS = [
    {
      id: 'sample-1', title: 'MDN Web Docs', url: 'https://developer.mozilla.org',
      category: 'Development', notes: 'Reference for HTML, CSS, and JS.',
      createdAt: new Date('2026-01-05T09:00:00Z').toISOString()
    },
    {
      id: 'sample-2', title: 'GitHub', url: 'https://github.com',
      category: 'Development', notes: 'Code hosting and version control.',
      createdAt: new Date('2026-01-05T09:05:00Z').toISOString()
    },
    {
      id: 'sample-3', title: 'Dribbble', url: 'https://dribbble.com',
      category: 'Design', notes: 'Design inspiration and portfolios.',
      createdAt: new Date('2026-01-05T09:10:00Z').toISOString()
    },
    {
      id: 'sample-4', title: 'Coursera', url: 'https://www.coursera.org',
      category: 'Learning', notes: '',
      createdAt: new Date('2026-01-05T09:15:00Z').toISOString()
    },
    {
      id: 'sample-5', title: 'Figma', url: 'https://figma.com',
      category: 'Design', notes: 'Collaborative interface design tool.',
      createdAt: new Date('2026-01-05T09:20:00Z').toISOString()
    }
  ];

  let bookmarks = [];
  let activeCategory = 'All';
  let searchTerm = '';
  let editingId = null;

  function generateId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  }

  function loadBookmarks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : null;
    } catch (e) {
      console.warn('Failed to parse stored bookmarks, resetting.', e);
      return null;
    }
  }

  function saveBookmarks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
      hideSaveWarning();
    } catch (e) {
      console.warn('Failed to save bookmarks to localStorage.', e);
      showSaveWarning();
    }
  }

  function showSaveWarning() {
    const el = document.getElementById('save-warning');
    el.textContent = 'Your changes could not be saved to this browser’s storage. They may be lost on reload.';
    el.hidden = false;
  }

  function hideSaveWarning() {
    document.getElementById('save-warning').hidden = true;
  }

  function seedSampleDataIfEmpty() {
    const existing = loadBookmarks();
    if (existing === null) {
      bookmarks = SAMPLE_BOOKMARKS.slice();
      saveBookmarks();
    } else {
      bookmarks = existing;
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function normalizeUrl(rawUrl) {
    const trimmed = rawUrl.trim();
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(trimmed) || /^mailto:/i.test(trimmed)) {
      return trimmed;
    }
    return 'https://' + trimmed;
  }

  function getCategories() {
    const seen = new Map();
    bookmarks.forEach(b => {
      const key = b.category.toLowerCase();
      if (!seen.has(key)) seen.set(key, b.category);
    });
    return Array.from(seen.values());
  }

  function getFilteredBookmarks() {
    return bookmarks.filter(b => {
      const matchesCategory = activeCategory === 'All' ||
        b.category.toLowerCase() === activeCategory.toLowerCase();
      const matchesSearch = searchTerm === '' ||
        b.title.toLowerCase().includes(searchTerm) ||
        b.category.toLowerCase().includes(searchTerm);
      return matchesCategory && matchesSearch;
    });
  }

  function cardTemplate(bookmark) {
    if (bookmark.id === editingId) return editCardTemplate(bookmark);

    const notesHtml = bookmark.notes
      ? `<p class="card-notes">${escapeHtml(bookmark.notes)}</p>`
      : '';
    return `
      <article class="card">
        <div class="card-header">
          <a class="card-title" href="${escapeHtml(bookmark.url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(bookmark.title)}">${escapeHtml(bookmark.title)}</a>
          <div class="card-actions">
            <button type="button" class="edit-btn" data-edit-id="${escapeHtml(bookmark.id)}" aria-label="Edit bookmark">✎</button>
            <button type="button" class="delete-btn" data-delete-id="${escapeHtml(bookmark.id)}" aria-label="Delete bookmark">✕</button>
          </div>
        </div>
        <span class="card-badge">${escapeHtml(bookmark.category)}</span>
        <span class="card-url" title="${escapeHtml(bookmark.url)}">${escapeHtml(bookmark.url)}</span>
        ${notesHtml}
      </article>
    `;
  }

  function editCardTemplate(bookmark) {
    return `
      <form class="card" data-edit-form-id="${escapeHtml(bookmark.id)}" novalidate>
        <div class="form-field">
          <label for="edit-title-${escapeHtml(bookmark.id)}">Title</label>
          <input id="edit-title-${escapeHtml(bookmark.id)}" name="title" type="text" value="${escapeHtml(bookmark.title)}" required>
        </div>
        <div class="form-field">
          <label for="edit-url-${escapeHtml(bookmark.id)}">URL</label>
          <input id="edit-url-${escapeHtml(bookmark.id)}" name="url" type="url" value="${escapeHtml(bookmark.url)}" required>
        </div>
        <div class="form-field">
          <label for="edit-category-${escapeHtml(bookmark.id)}">Category</label>
          <input id="edit-category-${escapeHtml(bookmark.id)}" name="category" type="text" list="category-options" value="${escapeHtml(bookmark.category)}" required>
        </div>
        <div class="form-field">
          <label for="edit-notes-${escapeHtml(bookmark.id)}">Notes</label>
          <textarea id="edit-notes-${escapeHtml(bookmark.id)}" name="notes" rows="2">${escapeHtml(bookmark.notes)}</textarea>
        </div>
        <div class="card-edit-actions">
          <button type="button" class="btn btn-secondary btn-sm" data-cancel-edit-id="${escapeHtml(bookmark.id)}">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save</button>
        </div>
      </form>
    `;
  }

  function renderChips() {
    const container = document.getElementById('category-chips');
    const categories = ['All', ...getCategories()];
    container.innerHTML = categories.map(cat => {
      const isActive = cat.toLowerCase() === activeCategory.toLowerCase();
      return `<button type="button" class="chip${isActive ? ' chip--active' : ''}" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`;
    }).join('');
  }

  function renderGrid() {
    const filtered = getFilteredBookmarks();
    const grid = document.getElementById('bookmark-grid');
    const emptyState = document.getElementById('empty-state');

    if (filtered.length === 0) {
      grid.innerHTML = '';
      emptyState.hidden = false;
      emptyState.textContent = bookmarks.length === 0
        ? 'No bookmarks yet. Add your first one above!'
        : 'No bookmarks match your search or filter.';
      return;
    }

    emptyState.hidden = true;
    grid.innerHTML = filtered
      .slice()
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
      .map(cardTemplate)
      .join('');
  }

  function renderCategoryOptions() {
    const datalist = document.getElementById('category-options');
    datalist.innerHTML = getCategories()
      .map(cat => `<option value="${escapeHtml(cat)}"></option>`)
      .join('');
  }

  function renderAll() {
    renderChips();
    renderGrid();
    renderCategoryOptions();
  }

  function handleAddSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const title = form.title.value.trim();
    const urlRaw = form.url.value.trim();
    const category = form.category.value.trim();
    const notes = form.notes.value.trim();

    if (!title || !urlRaw || !category) {
      form.reportValidity();
      return;
    }

    const newBookmark = {
      id: generateId(),
      title,
      url: normalizeUrl(urlRaw),
      category,
      notes,
      createdAt: new Date().toISOString()
    };

    bookmarks.push(newBookmark);
    saveBookmarks();
    form.reset();
    renderAll();
  }

  function handleSearchInput(e) {
    searchTerm = e.target.value.trim().toLowerCase();
    renderGrid();
  }

  function handleChipClick(e) {
    const chip = e.target.closest('[data-category]');
    if (!chip) return;
    activeCategory = chip.dataset.category;
    renderAll();
  }

  function handleGridClick(e) {
    const deleteBtn = e.target.closest('[data-delete-id]');
    if (deleteBtn) {
      const id = deleteBtn.dataset.deleteId;
      const bookmark = bookmarks.find(b => b.id === id);
      if (bookmark && confirm(`Delete "${bookmark.title}"?`)) {
        bookmarks = bookmarks.filter(b => b.id !== id);
        if (editingId === id) editingId = null;
        saveBookmarks();
        renderAll();
      }
      return;
    }

    const editBtn = e.target.closest('[data-edit-id]');
    if (editBtn) {
      editingId = editBtn.dataset.editId;
      renderGrid();
      return;
    }

    const cancelBtn = e.target.closest('[data-cancel-edit-id]');
    if (cancelBtn) {
      editingId = null;
      renderGrid();
    }
  }

  function handleEditSubmit(e) {
    const form = e.target.closest('[data-edit-form-id]');
    if (!form) return;
    e.preventDefault();

    const title = form.title.value.trim();
    const urlRaw = form.url.value.trim();
    const category = form.category.value.trim();
    const notes = form.notes.value.trim();

    if (!title || !urlRaw || !category) {
      form.reportValidity();
      return;
    }

    const bookmark = bookmarks.find(b => b.id === form.dataset.editFormId);
    if (bookmark) {
      bookmark.title = title;
      bookmark.url = normalizeUrl(urlRaw);
      bookmark.category = category;
      bookmark.notes = notes;
      saveBookmarks();
    }

    editingId = null;
    renderAll();
  }

  function attachEventListeners() {
    document.getElementById('bookmark-form').addEventListener('submit', handleAddSubmit);
    document.getElementById('search-input').addEventListener('input', handleSearchInput);
    document.getElementById('category-chips').addEventListener('click', handleChipClick);
    document.getElementById('bookmark-grid').addEventListener('click', handleGridClick);
    document.getElementById('bookmark-grid').addEventListener('submit', handleEditSubmit);
  }

  document.addEventListener('DOMContentLoaded', () => {
    seedSampleDataIfEmpty();
    attachEventListeners();
    renderAll();
  });
</script>

</body>
</html>
